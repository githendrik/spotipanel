; PlatformIO - CrowPanel 1.28" ESP32-S3
; Using factory defaults

[env:crowpanel_128]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Minimal settings - let defaults handle most things
board_build.flash_mode = qio
board_build.flash_size = 16MB

; Remove all PSRAM custom settings
; Remove USB CDC settings
; Remove custom partition table

upload_speed = 115200
upload_protocol = esptool

lib_deps = 
    lovyan03/LovyanGFX@^1.1.5
    bblanchon/ArduinoJson@^7.0.0
